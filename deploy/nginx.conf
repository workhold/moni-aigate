# Add to a TLS-enabled 1Panel/OpenResty server block. Replace upstream as needed.
location = /metrics { return 403; }

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite client input. Configure TRUSTED_PROXY_CIDRS with this proxy's
    # actual source address as seen by the app (container NAT may change it).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_read_timeout 320s;
    proxy_send_timeout 320s;
    proxy_next_upstream off;
    client_max_body_size 1m;
}
