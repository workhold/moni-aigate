name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    name: contracts (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [billing-0, billing-1, billing-2, billing-3, server-0, server-1, server-2, server-3, attempt-0, attempt-1, attempt-2, attempt-3, identity, other]
    env:
      TEST_DATABASE_URL: postgres://moni_test:test-only-password@127.0.0.1:55439/moni_test?sslmode=disable
      GO_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./scripts/check-architecture
        if: matrix.shard == 'other'
      - run: go run ./scripts/check-procurement-layout
        if: matrix.shard == 'other'
      - run: go run ./scripts/check-upstream-provenance
        if: matrix.shard == 'other'
      - uses: actions/setup-node@v4
        if: matrix.shard == 'other'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        if: matrix.shard == 'other'
        working-directory: web
      # Each matrix job owns a disposable database. Host networking preserves
      # the server-side loopback endpoint required by the sandbox proof.
      # Trust matches the historical LOGIN fixtures; it is not a deployment
      # authentication setting or evidence of password authentication.
      - name: Start dedicated PostgreSQL for financial and sandbox tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name moni-aigate-test-pg \
            --network host \
            --env POSTGRES_USER=moni_test --env POSTGRES_DB=moni_test \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16-alpine postgres -p 55439 \
            -c listen_addresses=127.0.0.1 \
            -c timezone=Asia/Shanghai \
            -c max_connections=200 \
            -c fsync=on -c synchronous_commit=on -c full_page_writes=on
          for attempt in $(seq 1 60); do
            if [[ "$(docker exec moni-aigate-test-pg \
              psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55439 \
              -U moni_test -d moni_test \
              -c "SELECT CASE WHEN inet_server_addr() = '127.0.0.1'::inet
                AND inet_server_port() = 55439
                AND current_database() = 'moni_test' AND current_user = 'moni_test'
                AND current_setting('TimeZone') = 'Asia/Shanghai'
                AND current_setting('max_connections') = '200'
                AND current_setting('fsync') = 'on'
                AND current_setting('synchronous_commit') = 'on'
                AND current_setting('full_page_writes') = 'on'
                THEN 'ready' ELSE 'not_ready' END")" == "ready" ]]; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify complete package and top-level test partitions and run Go tests
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          case "$GO_TEST_SHARD" in
            billing-[0-3]) package_class=billing ;;
            server-[0-3]) package_class=server ;;
            attempt-[0-3]) package_class=attempt ;;
            identity|other) package_class=$GO_TEST_SHARD ;;
            *) echo "Unknown Go test partition" >&2; exit 1 ;;
          esac
          go run ./scripts/acceptance-shard-plan --emit-legacy "$RUNNER_TEMP"

          # Legacy artifact names are emitted from the same complete plan.
          # Package and test execution below intentionally keeps its original
          # environment, race, -p 1, -count=1 and per-process timeout contract.
          mapfile -t packages < "$RUNNER_TEMP/ci-packages-$package_class.txt"
          run_filter=()
          if [[ "$package_class" != identity && "$package_class" != other ]]; then
            expression="^($(paste -sd '|' "$RUNNER_TEMP/ci-tests-$GO_TEST_SHARD.txt"))$"
            run_filter=(-run "$expression")
          fi
          # Prefix and pure identity acceptance own random schemas in this
          # job's disposable database. Neither changes ordinary startup.
          test_env=()
          if [[ "$GO_TEST_SHARD" == other ]]; then
            # The 023-B-P1 prefix candidate is frozen historical research. Its
            # PostgreSQL harness is compile-only in the current MVP gate.
            test_env+=("PROCUREMENT_IDENTITY_DATABASE_URL=$TEST_DATABASE_URL")
          fi
          if [[ "$package_class" == billing ]]; then
            test_env+=("PROCUREMENT_ATTEMPT_RULES_DATABASE_URL=$TEST_DATABASE_URL")
          fi
          # Packages share this job's disposable database and installer role.
          # Serialize package execution just as make verify-mvp does: isolated
          # schemas do not isolate ALTER DEFAULT PRIVILEGES for that creator.
          # Explicit within-test concurrency and every discovered test remain.
          # Identity also exceeded the cumulative ten-minute per-process budget.
          # Keep its runner name and complete test set, but invoke four independent
          # test binaries so no single process is asked to exceed that bound.
          if [[ "$package_class" == identity ]]; then
            : > "$RUNNER_TEMP/go-tests-$GO_TEST_SHARD.jsonl"
            identity_failed=0
            for part in 0 1 2 3; do
              expression="^($(paste -sd '|' "$RUNNER_TEMP/ci-tests-$package_class-$part.txt"))$"
              if env "${test_env[@]}" go test -json -race -p 1 -count=1 -timeout=10m -run "$expression" "${packages[@]}" \
                | tee -a "$RUNNER_TEMP/go-tests-$GO_TEST_SHARD.jsonl"; then
                :
              else
                identity_failed=1
              fi
            done
            # A failing partition must not remove the remaining tests from the
            # evidence set. Report failure only after all four have completed.
            if [[ "$identity_failed" -ne 0 ]]; then
              exit "$identity_failed"
            fi
          else
            env "${test_env[@]}" go test -json -race -p 1 -count=1 -timeout=10m "${run_filter[@]}" "${packages[@]}" \
              | tee "$RUNNER_TEMP/go-tests-$GO_TEST_SHARD.jsonl"
          fi
      - run: go vet ./...
        if: matrix.shard == 'other'
      - run: go build -trimpath ./cmd/moni-aigate
        if: matrix.shard == 'other'
      - name: Stop isolated database
        if: always()
        run: docker rm --force moni-aigate-test-pg
      - name: Preserve Go test timing and complete package and test partitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shard-plan.json
            ${{ runner.temp }}/go-tests-${{ matrix.shard }}.jsonl
            ${{ runner.temp }}/ci-packages-*.txt
            ${{ runner.temp }}/ci-tests-*.txt
          if-no-files-found: warn
